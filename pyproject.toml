[project]
name = "transcost"
version = "0.1.0"
description = "Dashboard de analise dos custos do governo federal brasileiro"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "psycopg2-binary>=2.9",
    "gunicorn>=22.0",
    "celery>=5.4",
    "django-celery-beat>=2.6",
    "redis>=5.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
